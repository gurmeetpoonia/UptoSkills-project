# One-command setup:  docker compose up --build   ->  http://localhost:8080
# Secrets come from a root-level ".env" file (copy ".env.example"). Never commit ".env".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesforge
      POSTGRES_USER: salesforge
      POSTGRES_PASSWORD: salesforge
    ports:
      - "5432:5432"
    volumes:
      - salesforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesforge -d salesforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - salesforge_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Neon pooled URL) in .env}
      DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL (Neon direct URL) in .env}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-postgresql://salesforge:salesforge@db:5432/salesforge_shadow?schema=public}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL (live Redis) in .env}
      SCRAPER_API_URL : http://scraper:8000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper:
        condition: service_started

    # migrate deploy applies the migration history (includes the baseline migration) on a fresh DB
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile.with-tool
    restart: unless-stopped
    environment:
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      SCRAPER_ENGINE: ${SCRAPER_ENGINE:-linkedin}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  salesforge_pgdata:
  salesforge_redisdata:
