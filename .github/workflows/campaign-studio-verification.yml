name: Campaign Studio verification

on:
  push:
    branches:
      - feature/tl-ai-campaign-studio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check campaign backend syntax
        run: |
          node --check backend/controllers/campaignController.js
          node --check backend/services/campaignAutomationService.js
          node --check backend/services/aiEmailService.js
          node --check backend/services/emailService.js
